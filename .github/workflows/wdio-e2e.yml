name: ⚕️ MedPulse WebdriverIO E2E & BDD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  e2e-testing:
    name: 🧪 Run WebdriverIO Cucumber E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🌐 Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 🚀 Execute Turnkey E2E Suite (7 BDD Specs, Parallel Workers)
        run: npm test

      - name: 📊 Generate Standalone Executive Dashboard & Allure Report
        if: always()
        run: |
          npm run report:html || true
          npm run report:generate || true

      - name: 📑 Upload Executive HTML Dashboard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medpulse-executive-dashboard
          path: reports/medpulse-e2e-report.html
          retention-days: 30

      - name: 📈 Upload Allure Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-e2e-report
          path: allure-report/
          retention-days: 14
